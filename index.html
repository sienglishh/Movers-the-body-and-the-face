<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards Từ Vựng Tiếng Anh - The Body & The Face</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 2rem;
      text-align: center;
    }

    .card {
      width: 330px;
      height: 410px;
      background: #ffffff;
      border-radius: 25px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      border: 5px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    .icon {
      font-size: 5rem;
      margin-top: 10px;
    }

    .text-container {
      text-align: center;
    }

    .word {
      font-size: 2.3rem;
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 8px;
    }

    .meaning {
      font-size: 1.7rem;
      font-weight: bold;
      color: #2980b9;
    }

    .btn-audio {
      background: #e67e22;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    .btn-audio:hover {
      background: #d35400;
      transform: scale(1.05);
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn-nav {
      background: #2980b9;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(41, 128, 185, 0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-nav:hover {
      background: #1b4f72;
      transform: scale(1.05);
    }

    .progress {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2c3e50;
      background: rgba(255,255,255,0.7);
      padding: 8px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>👀 The Body & The Face 👀</h1>

  <div class="card">
    <div class="icon" id="icon">🧍</div>
    
    <div class="text-container">
      <div class="word" id="word">back</div>
      <div class="meaning" id="meaning">lưng</div>
    </div>

    <button class="btn-audio" onclick="speakCurrentWord()">🔊 Nghe đọc</button>
  </div>

  <div class="controls">
    <button class="btn-nav" onclick="prevCard()">◄ Trước</button>
    <div class="progress" id="progress">1 / 12</div>
    <button class="btn-nav" onclick="nextCard()">Sau ►</button>
  </div>

  <script>
    const vocabulary = [
      { word: "back", meaning: "lưng", icon: "🧍" },
      { word: "beard", meaning: "râu quai nón", icon: "🧔" },
      { word: "blond(e)", meaning: "tóc vàng hoe", icon: "👱" },
      { word: "curly", meaning: "tóc xoăn", icon: "👩‍🦱" },
      { word: "fair", meaning: "tóc sáng màu / da sáng", icon: "👱‍♀️" },
      { word: "fat", meaning: "mập / béo", icon: "🧍‍♂️" },
      { word: "moustache", meaning: "ria mép", icon: "👨" },
      { word: "neck", meaning: "cổ", icon: "🦒" },
      { word: "shoulder", meaning: "vai", icon: "🤷" },
      { word: "stomach", meaning: "bụng / dạ dày", icon: "🫄" },
      { word: "thin", meaning: "gầy / ốm", icon: "🧍‍♀️" },
      { word: "tooth / teeth", meaning: "răng (số ít / số nhiều)", icon: "🦷" }
    ];

    let currentIndex = 0;
    const wordElement = document.getElementById('word');
    const meaningElement = document.getElementById('meaning');
    const iconElement = document.getElementById('icon');
    const progressElement = document.getElementById('progress');

    function updateCard() {
      const item = vocabulary[currentIndex];
      wordElement.textContent = item.word;
      meaningElement.textContent = item.meaning;
      iconElement.textContent = item.icon;
      progressElement.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextCard() {
      if (currentIndex < vocabulary.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function speakCurrentWord() {
      // Loại bỏ dấu gạch chéo để đọc chuẩn hơn (đặc biệt cho tooth / teeth)
      const text = vocabulary[currentIndex].word.replace('/', ' ');
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // Khởi tạo thẻ đầu tiên
    updateCard();
  </script>
</body>
</html>
